mod_description=Small compatibility and performance patches for Iron's Spells 'n Spellbooks and its addons.\n- Iron's Spell's Enchantments now count enchantment levels added by Apotheosis gems.\n- Black Hole fluid checks only scan chunk sections that contain fluids (same behavior, far less lag).\n- Arcane Manifestation caches its owner and boss method lookups instead of using reflection on every entity every tick (same behavior, less server lag).
