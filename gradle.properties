mod_description=Small compatibility and performance patches for Iron's Spells 'n Spellbooks and its addons. Now with config support. \n- Iron's Spell's Enchantments now count enchantment levels added by Apotheosis gems (configurable).\n- Black Hole fluid checks only scan chunk sections that contain fluids (same behavior, far less lag).\n- Arcane Manifestation caches its owner and boss method lookups instead of using reflection on every entity every tick (same behavior, less server lag).\n- Health and absorption can no longer become NaN, and NaN-health saves are healed on load (configurable).\n- Majrusz's Death Wish no longer boosts /kill or void damage (configurable).\n- Antarchy's Chronosphere no longer slows its wearer's own summons and pets (configurable).\n- Spirit Banish (ws_effect_lib) returns the player to their body even after a world restart (configurable).
